[phases.setup]
nixPkgs = ["python311"]

aptPkgs = [
  "libxcb1",
  "libx11-6",
  "libxrender1",
  "libxext6",
  "libxi6",
  "libxrandr2",
  "libxfixes3",
  "libxinerama1",
  "libgl1",
  "libglib2.0-0"
]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app:app --host 0.0.0.0 --port $PORT"
