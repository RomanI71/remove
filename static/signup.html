<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Tailwind</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #a1a1aa;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 md:p-10 bg-gray-50">

    <div id="signup-container" class="w-full max-w-md bg-white p-8 sm:p-10 rounded-xl shadow-2xl border border-gray-100 transition-all duration-300">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">
            Sign Up Now
        </h2>
        <p class="text-center text-sm text-gray-500 mb-8">
            Start your journey with a new account.
        </p>

        <!-- Message Box -->
        <div id="message-box" class="hidden p-3 mb-6 rounded-lg text-sm transition-opacity duration-500 ease-in-out"></div>

        <form id="signup-form" class="space-y-5">
            
            <!-- Full Name -->
            <div>
                <label for="fullname" class="block text-sm font-medium text-gray-700">Full Name</label>
                <div class="mt-1">
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150"
                           autocomplete="name">
                </div>
            </div>

            <!-- Email Address -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <div class="mt-1">
                    <input type="email" id="email" name="email" placeholder="e.g., user@example.com" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150"
                           autocomplete="email">
                </div>
            </div>
            
            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1">
                    <input type="password" id="password" name="password" placeholder="Min. 8 characters" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150"
                           minlength="8" autocomplete="new-password">
                </div>
                <p id="password-help" class="mt-1 text-xs text-gray-500">Password must be at least 8 characters long.</p>
            </div>
            
            <!-- Confirm Password -->
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <div class="mt-1">
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition duration-150"
                           autocomplete="new-password">
                </div>
            </div>

            <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-lg font-semibold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out transform hover:scale-[1.01] active:scale-[0.99]">
                Create Account
            </button>
            
            <p class="text-center text-sm text-gray-600 pt-2">
                Already have an account? 
                <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 transition duration-150 ease-in-out">
                    Log In Here
                </a>
            </p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signup-form');
            const messageBox = document.getElementById('message-box');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm-password');

            const showMessage = (message, type) => {
                messageBox.textContent = message;
                messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'border-red-400', 'bg-green-100', 'text-green-800', 'border-green-400');

                if (type === 'error') {
                    messageBox.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-400');
                } else if (type === 'success') {
                    messageBox.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-400');
                }
                
                // Show message box with fade in effect
                messageBox.style.opacity = '0';
                setTimeout(() => {
                    messageBox.style.opacity = '1';
                }, 10);

                // Optional: Hide message after a few seconds
                setTimeout(() => {
                    messageBox.style.opacity = '0';
                    setTimeout(() => {
                        messageBox.classList.add('hidden');
                    }, 500); // Wait for transition to finish
                }, 5000);
            };

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                messageBox.classList.add('hidden'); // Clear previous message

                const fullname = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!fullname || !email || !password || !confirmPassword) {
                    showMessage("All fields are required. Please fill out the form completely.", 'error');
                    return;
                }

                if (password.length < 8) {
                    showMessage("Password must be at least 8 characters long.", 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showMessage("Passwords do not match. Please ensure they are identical.", 'error');
                    return;
                }

                // If validation passes, simulate successful account creation
                console.log("Form Data:", { fullname, email, password });
                showMessage("Account creation successful! You can now log in.", 'success');

                // In a real application, you would send this data to a server using fetch() here.
                // Example: fetch('/api/signup', { method: 'POST', body: JSON.stringify({ fullname, email, password }) })
            });
        });
    </script>
</body>
</html>
