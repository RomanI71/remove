<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Background Remover — iLoveIMG Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:#f8fafc;--card:#fff;--accent:#3498db;--muted:#6b7280;
      --success:#10b981;--error:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial;background:var(--bg);color:#0f172a;}
    .wrap{max-width:960px;margin:40px auto;padding:20px;}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    h1{font-size:22px;margin:0;}
    .feature-badge{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;padding:4px 8px;border-radius:8px;font-size:11px;margin-left:6px;}
    .card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 6px 16px rgba(0,0,0,0.05);}
    .upload-box{border:2px dashed rgba(15,23,42,0.1);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:all 0.3s;}
    .upload-box.highlight{border-color:var(--accent);background:#e0f2fe;}
    .upload-box h3{font-size:16px;margin:8px 0;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:none;font-weight:600;cursor:pointer;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-success{background:var(--success);color:#fff;}
    .btn:disabled{opacity:0.7;cursor:not-allowed;}
    .grid{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px;}
    .preview{background:repeating-conic-gradient(#ccc 0% 25%, transparent 0% 50%) 50% / 20px 20px;border-radius:12px;display:flex;justify-content:center;align-items:center;min-height:320px;}
    .preview img{max-width:100%;max-height:360px;border-radius:8px;display:none;}
    .progress{height:8px;background:#e2e8f0;border-radius:8px;margin-top:10px;overflow:hidden;}
    .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f59e0b);transition:width .3s;}
    .status{font-size:14px;margin-top:10px;display:flex;align-items:center;gap:8px;}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);}
    .dot.processing{background:var(--accent);animation:pulse 1.5s infinite;}
    .dot.ready{background:var(--success);}
    .dot.error{background:var(--error);}
    .download-btn{display:flex;justify-content:space-between;align-items:center;margin-top:12px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;}
    @keyframes pulse {0%,100%{opacity:1;}50%{opacity:0.4;}}
    footer{text-align:center;font-size:13px;color:var(--muted);margin-top:30px;}
    @media(max-width:850px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Remove Background <span class="feature-badge"><i class="fa fa-star"></i> AI Powered</span></h1>
      <a href="/index.html" class="btn btn-primary"><i class="fa fa-home"></i> Home</a>
    </div>

    <div class="card">
      <div class="upload-box" id="uploadBox">
        <i class="fa fa-cloud-upload" style="font-size:36px;color:var(--accent)"></i>
        <h3>Drag & drop or select an image</h3>
        <p style="color:var(--muted);font-size:13px;">JPG, PNG, WebP • Max 10MB</p>
        <button id="selectBtn" class="btn btn-primary"><i class="fa fa-folder-open"></i> Select Image</button>
        <input id="fileInput" type="file" accept="image/*" hidden>
      </div>

      <div class="grid">
        <div>
          <div class="preview" id="previewArea">
            <img id="previewImg" alt="Preview">
            <div id="placeholder" style="color:var(--muted);font-size:14px;">No image selected</div>
          </div>
          <button id="removeBgBtn" class="btn btn-primary" style="width:100%;margin-top:14px;">
            <i class="fa fa-scissors"></i> Remove Background
          </button>
          <div class="progress"><i id="bar"></i></div>
          <div class="status"><div id="dot" class="dot"></div><span id="status">Ready</span></div>
        </div>

        <div>
          <div id="downloadWrap" style="display:none;">
            <div class="download-btn">
              <div>
                <strong id="outName">output.png</strong>
                <div style="font-size:12px;color:#d1d5db;">Transparent Background</div>
              </div>
              <a id="downloadLink" class="btn btn-success" download><i class="fa fa-download"></i> Download</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>© 2025 iLoveIMG Clone — Background Remover by AI</p>
    </footer>
  </div>

  <script>
    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const selectBtn = document.getElementById("selectBtn");
    const previewImg = document.getElementById("previewImg");
    const placeholder = document.getElementById("placeholder");
    const removeBgBtn = document.getElementById("removeBgBtn");
    const downloadWrap = document.getElementById("downloadWrap");
    const downloadLink = document.getElementById("downloadLink");
    const bar = document.getElementById("bar");
    const statusText = document.getElementById("status");
    const dot = document.getElementById("dot");
    const outName = document.getElementById("outName");
    
    let currentFile = null;

    // ✅ Auto-detect backend: works in local + Railway
    const BACKEND_URL = window.location.hostname.includes("localhost") 
      ? "http://localhost:8000"
      : "https://free-production-0a3b.up.railway.app";

    console.log("🌐 Backend connected to:", BACKEND_URL);

    selectBtn.addEventListener("click",()=>fileInput.click());
    fileInput.addEventListener("change",e=>handleFile(e.target.files[0]));
    uploadBox.addEventListener("dragover",e=>{e.preventDefault();uploadBox.classList.add("highlight");});
    uploadBox.addEventListener("dragleave",()=>uploadBox.classList.remove("highlight"));
    uploadBox.addEventListener("drop",e=>{
      e.preventDefault();
      uploadBox.classList.remove("highlight");
      if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file){
      if(!file || !file.type.startsWith("image/")) return alert("Please select an image file!");
      currentFile=file;
      const reader=new FileReader();
      reader.onload=e=>{
        previewImg.src=e.target.result;
        previewImg.style.display="block";
        placeholder.style.display="none";
      };
      reader.readAsDataURL(file);
    }

    removeBgBtn.addEventListener("click",async()=>{
      if(!currentFile) return alert("No image selected!");
      removeBgBtn.disabled=true;
      dot.className="dot processing";
      statusText.textContent="Processing...";
      bar.style.width="20%";
      downloadWrap.style.display="none";

      const formData=new FormData();
      formData.append("image",currentFile);
      formData.append("background_color","transparent");
      formData.append("quality","high");

      try{
        const res=await fetch(`${BACKEND_URL}/remove-bg`,{method:"POST",body:formData});
        if(!res.ok) throw new Error("Server error");
        const data=await res.json();

        if(data.downloadUrl){
          const fullUrl = data.downloadUrl.startsWith("http") 
            ? data.downloadUrl 
            : `${BACKEND_URL}${data.downloadUrl.startsWith('/') ? '' : '/'}${data.downloadUrl}`;
          
          previewImg.src = fullUrl;
          downloadLink.href=fullUrl;
          outName.textContent=data.filename||"output.png";
          downloadWrap.style.display="block";
          bar.style.width="100%";
          dot.className="dot ready";
          statusText.textContent="Done ✅";
        } else {
          throw new Error("No file returned from server");
        }
      }catch(err){
        console.error(err);
        bar.style.width="100%";
        dot.className="dot error";
        statusText.textContent="Failed ❌";
        alert("Background removal failed!");
      }finally{
        removeBgBtn.disabled=false;
      }
    });
  </script>
</body>
</html>
