<style>
:root{--bg:#f8fafc;--card:#fff;--accent:#3498db;--muted:#4b5563; --border:#e2e8f0;}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial;background:var(--bg);margin:0;color:#0f172a; line-height: 1.5;}

.wrap{max-width:980px;margin:36px auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{display:flex;gap:12px;align-items:center}
.logo img{height:36px; width:auto;} 

h1{font-size:22px;margin:0}
p.lead{color:var(--muted);margin:6px 0 0; font-size: 15px;}

.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 6px 20px rgba(2,6,23,0.06)}

.upload-box{
  border:2px dashed rgba(15,23,42,0.08);border-radius:10px;padding:28px;
  display:flex;gap:20px;align-items:center;justify-content:center;flex-direction:column;
  cursor:pointer; transition: background 0.2s, border-color 0.2s;
  outline: none;
}
.upload-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.upload-box:hover, .upload-box.highlight{background:#eff6ff; border-color:var(--accent)}

.upload-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px; text-decoration: none;}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:#111827;color:#fff}

.grid{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}

.preview{display:flex;flex-direction:column;gap:8px;align-items:center; min-height: 360px; justify-content: center; position: relative; overflow: hidden;}
.preview canvas{max-width:100%;max-height:500px;border-radius:8px;background:#f3f4f6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); object-fit: contain;}

.small{font-size:13px;color:var(--muted); font-weight: 500;}
.control-group { margin-top: 12px; }
.control-group label { display: block; margin-bottom: 4px; }
.control-group input[type="range"] { width: 100%; cursor: pointer; }

footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}

/* Accessibility Utility */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }

@media(max-width:900px){.grid{grid-template-columns:1fr}.preview canvas{max-height:400px}}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>

<svg width="0" height="0" style="position:absolute;z-index:-1;" aria-hidden="true">
  <defs>
    <filter id="sharpenFilter">
      <feConvolveMatrix id="sharpenMatrix" order="3 3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0"/>
    </filter>
  </defs>
</svg>

<div class="wrap">
  <header class="header">
    <div class="logo">
      <img src="/static/img/edit-image.png" alt="TopImgTools Logo" width="36" height="36">
      <div>
        <h1>Photo Edit</h1>
        <p class="lead">Pro Tools: Blur, Sharpen, Smooth & Blemish Heal.</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/index.html" aria-label="Go back to home"><i class="fa fa-arrow-left" aria-hidden="true"></i> Back</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="upload-box" id="uploadBox" role="button" tabindex="0" aria-label="Upload image area">
        <div style="text-align:center">
          <i class="fa fa-cloud-upload" style="font-size:36px;color:var(--accent)" aria-hidden="true"></i>
          <h3 style="margin:8px 0 6px">Drag & drop or select an image</h3>
          <p class="small muted">JPG, PNG, WebP — max 25MB</p>
        </div>
        <div class="upload-actions">
          <button id="selectBtn" class="btn btn-primary" tabindex="-1"><i class="fa fa-folder-open" aria-hidden="true"></i> Select Image</button>
          <label for="fileInput" class="sr-only">Upload Image File</label>
          <input id="fileInput" type="file" accept="image/*" style="display:none">
        </div>
      </div>

      <div class="grid" style="margin-top:18px">
        <div class="card">
          <div class="preview">
            <canvas id="canvas" role="img" aria-label="Preview of your edited photo"></canvas>
            <div id="placeholder" style="padding:26px;text-align:center;color:var(--muted)">Preview will appear here</div>
          </div>
        </div>

        <aside class="card" aria-label="Photo Editing Controls">
          <strong>Filters & Adjustments</strong>
          
          <div class="control-group">
            <label class="small" for="brightness">Brightness</label>
            <input type="range" id="brightness" min="0" max="200" value="100" aria-valuemin="0" aria-valuemax="200">
          </div>

          <div class="control-group">
            <label class="small" for="contrast">Contrast</label>
            <input type="range" id="contrast" min="0" max="200" value="100" aria-valuemin="0" aria-valuemax="200">
          </div>

          <div class="control-group">
            <label class="small" for="saturate">Saturation</label>
            <input type="range" id="saturate" min="0" max="200" value="100" aria-valuemin="0" aria-valuemax="200">
          </div>
          
          <div class="control-group" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
            <label class="small" for="bgBlur">Background Blur Radius</label>
            <input type="range" id="bgBlur" min="0" max="20" value="5" aria-valuemin="0" aria-valuemax="20">
          </div>

          <div class="control-group">
            <label class="small" for="imageBlur">Blurring (Global)</label>
            <input type="range" id="imageBlur" min="0" max="20" value="0" aria-valuemin="0" aria-valuemax="20">
          </div>

          <div class="control-group">
            <label class="small" for="sharpen">Sharpening</label>
            <input type="range" id="sharpen" min="0" max="100" value="0" aria-valuemin="0" aria-valuemax="100">
          </div>

          <div class="control-group">
            <label class="small" for="smoothing">Skin Smoothing</label>
            <input type="range" id="smoothing" min="0" max="100" value="0" aria-valuemin="0" aria-valuemax="100">
          </div>

          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
            <button id="healBtn" class="btn btn-secondary" aria-pressed="false" title="Spot Heal (Blemish Removal)"><i class="fa fa-band-aid" aria-hidden="true"></i> Heal Tool</button>
            <button id="bwBtn" class="btn btn-secondary" aria-pressed="false" title="Toggle Black and White"><i class="fa fa-adjust" aria-hidden="true"></i> B/W</button>
            <button id="sepiaBtn" class="btn btn-secondary" aria-pressed="false" title="Toggle Sepia"><i class="fa fa-fire" aria-hidden="true"></i> Sepia</button>
            <button id="rotateBtn" class="btn btn-secondary" title="Rotate 90 degrees"><i class="fa fa-rotate" aria-hidden="true"></i> Rotate</button>
            <button id="flipBtn" class="btn btn-secondary" title="Flip Horizontally"><i class="fa fa-arrows-left-right" aria-hidden="true"></i> Flip</button>
            <button id="resetBtn" class="btn btn-secondary" title="Reset all changes"><i class="fa fa-undo" aria-hidden="true"></i> Reset</button>
          </div>
          
          <div style="margin-top:20px; border-top: 1px solid var(--border); padding-top: 15px;">
            <button id="downloadBtn" class="btn btn-secondary" style="width:100%; justify-content:center; background:#10b981;"><i class="fa fa-download" aria-hidden="true"></i> Save Maximum Quality</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> TopImgTools. All rights reserved.
  </footer>
</div>

<script>
const fileInput=document.getElementById('fileInput');
const selectBtn=document.getElementById('selectBtn');
const uploadBox=document.getElementById('uploadBox');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const placeholder=document.getElementById('placeholder');
const bwBtn=document.getElementById('bwBtn');
const sepiaBtn=document.getElementById('sepiaBtn');
const healBtn=document.getElementById('healBtn');

let img=new Image();
let filters={bw:false,sepia:false};
let adjustments={brightness:100,contrast:100,saturate:100,bgBlur:5, imageBlur:0, sharpen:0, smoothing:0};
let rotation=0;
let flipped=false;

// Heal Tool Variables
let isHealMode = false;
let blemishes = [];
let patchedCanvas = document.createElement('canvas');
let pCtx = patchedCanvas.getContext('2d', { willReadFrequently: true });

// Rendering Optimizer Variables
let isDrawing = false;
let needsRedraw = false;

const handleFileSelect = () => fileInput.click();
selectBtn.onclick = (e) => { e.stopPropagation(); handleFileSelect(); };
uploadBox.onclick = handleFileSelect;

uploadBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleFileSelect();
    }
});

fileInput.onchange=e=>loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>uploadBox.addEventListener(ev,e=>{e.preventDefault();uploadBox.classList.add('highlight');}));
['dragleave','drop'].forEach(ev=>uploadBox.addEventListener(ev,e=>{e.preventDefault();uploadBox.classList.remove('highlight');}));
uploadBox.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

function loadFile(file){
 if(!file||!file.type.startsWith('image/'))return alert('Please select an image.');
 const reader=new FileReader();
 reader.onload=()=>{img.src=reader.result};
 reader.readAsDataURL(file);
 img.onload=()=>{
    // Use natural dimensions for MAX QUALITY
    canvas.width = img.naturalWidth; 
    canvas.height = img.naturalHeight;
    patchedCanvas.width = img.naturalWidth; 
    patchedCanvas.height = img.naturalHeight;
    
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    pCtx.imageSmoothingEnabled = true;
    pCtx.imageSmoothingQuality = 'high';

    blemishes = [];
    updatePatchedCanvas();
    requestDraw();
    placeholder.style.display='none';
 };
}

// Optimized Render Queue
function requestDraw() {
    if (!isDrawing) {
        isDrawing = true;
        requestAnimationFrame(() => {
            draw();
            isDrawing = false;
            if (needsRedraw) {
                needsRedraw = false;
                requestDraw();
            }
        });
    } else {
        needsRedraw = true;
    }
}

function updatePatchedCanvas() {
    if (!img.src) return;
    pCtx.clearRect(0,0,patchedCanvas.width, patchedCanvas.height);
    pCtx.drawImage(img, 0, 0);
    
    // Scale blemish size based on image resolution so it works on large images
    const blemishRadius = Math.max(16, img.naturalWidth * 0.015); 
    
    blemishes.forEach(b => {
        let offsetX = b.x > (blemishRadius * 2) ? -(blemishRadius * 1.5) : (blemishRadius * 1.5);
        pCtx.save();
        pCtx.beginPath();
        pCtx.arc(b.x, b.y, blemishRadius, 0, Math.PI * 2);
        pCtx.clip();
        pCtx.filter = 'blur(2px)'; 
        pCtx.drawImage(
            patchedCanvas, 
            b.x + offsetX - blemishRadius, b.y - blemishRadius, blemishRadius * 2, blemishRadius * 2, 
            b.x - blemishRadius, b.y - blemishRadius, blemishRadius * 2, blemishRadius * 2
        );
        pCtx.restore();
    });
}

function updateSharpenMatrix() {
    const s = adjustments.sharpen / 50; 
    const matrix = document.getElementById('sharpenMatrix');
    if (s === 0) {
        matrix.setAttribute('kernelMatrix', `0 0 0 0 1 0 0 0 0`);
    } else {
        const center = 1 + 4 * s;
        const edge = -s;
        matrix.setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);
    }
}

function buildFilter(){
 let f='';
 if(filters.bw) f+='grayscale(100%) ';
 if(filters.sepia) f+='sepia(100%) ';
 if(adjustments.imageBlur > 0) f+=`blur(${adjustments.imageBlur}px) `;
 if(adjustments.sharpen > 0) f+=`url(#sharpenFilter) `;
 return `brightness(${adjustments.brightness}%) contrast(${adjustments.contrast}%) saturate(${adjustments.saturate}%) ${f}`.trim();
}

function draw(){
 if(!img.src) return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 
 // Draw background ONLY if rotated/scaled to save performance
 if (rotation !== 0 || flipped) {
     ctx.save();
     ctx.filter=`blur(${adjustments.bgBlur}px)`;
     ctx.drawImage(img,0,0, canvas.width, canvas.height);
     ctx.restore();
 }
 
 updateSharpenMatrix();
 
 ctx.save();
 ctx.filter=buildFilter();
 ctx.translate(canvas.width/2,canvas.height/2);
 ctx.rotate(rotation*Math.PI/180);
 ctx.scale(flipped?-1:1,1);
 
 // Main Draw
 ctx.drawImage(patchedCanvas,-canvas.width/2,-canvas.height/2);
 ctx.restore();

 // Skin Smoothing - Optimized Layer
 if (adjustments.smoothing > 0) {
     ctx.save();
     ctx.globalAlpha = adjustments.smoothing / 160; 
     ctx.filter = buildFilter() + ' blur(12px)';
     ctx.translate(canvas.width/2,canvas.height/2);
     ctx.rotate(rotation*Math.PI/180);
     ctx.scale(flipped?-1:1,1);
     ctx.drawImage(patchedCanvas,-canvas.width/2,-canvas.height/2);
     ctx.restore();
 }
}

// Blemish Heal Interaction
canvas.addEventListener('click', (e) => {
    if (!isHealMode || !img.src) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    let x = (e.clientX - rect.left) * scaleX;
    let y = (e.clientY - rect.top) * scaleY;

    x -= canvas.width / 2;
    y -= canvas.height / 2;

    const rad = -rotation * Math.PI / 180;
    const rx = x * Math.cos(rad) - y * Math.sin(rad);
    const ry = x * Math.sin(rad) + y * Math.cos(rad);

    const fx = flipped ? -rx : rx;
    const fy = ry;

    blemishes.push({ x: fx + canvas.width / 2, y: fy + canvas.height / 2 });
    
    updatePatchedCanvas();
    requestDraw();
});

// Use Optimized Render Queue for UI sliders
['brightness','contrast','saturate','bgBlur','imageBlur','sharpen','smoothing'].forEach(id=>{
 document.getElementById(id).addEventListener('input', e => {
   adjustments[id]=e.target.value;
   requestDraw(); 
 });
});

bwBtn.onclick=()=>{
    filters.bw=!filters.bw; 
    bwBtn.setAttribute("aria-pressed", filters.bw);
    requestDraw();
};

sepiaBtn.onclick=()=>{
    filters.sepia=!filters.sepia; 
    sepiaBtn.setAttribute("aria-pressed", filters.sepia);
    requestDraw();
};

healBtn.onclick=()=>{
    isHealMode = !isHealMode;
    healBtn.classList.toggle('btn-primary', isHealMode);
    healBtn.classList.toggle('btn-secondary', !isHealMode);
    canvas.style.cursor = isHealMode ? 'crosshair' : 'default';
};

document.getElementById('rotateBtn').onclick=()=>{rotation=(rotation+90)%360; requestDraw();};
document.getElementById('flipBtn').onclick=()=>{flipped=!flipped; requestDraw();};

document.getElementById('resetBtn').onclick=()=>{
 filters={bw:false,sepia:false};
 adjustments={brightness:100,contrast:100,saturate:100,bgBlur:5, imageBlur:0, sharpen:0, smoothing:0};
 rotation=0; flipped=false;
 blemishes = [];
 updatePatchedCanvas();
 
 ['brightness','contrast','saturate','bgBlur','imageBlur','sharpen','smoothing'].forEach(id=>document.getElementById(id).value=adjustments[id]);
 bwBtn.setAttribute("aria-pressed", "false");
 sepiaBtn.setAttribute("aria-pressed", "false");
 
 if(isHealMode) healBtn.click();
 requestDraw();
};

document.getElementById('downloadBtn').onclick=()=>{
 if(!img.src) return alert("Please upload an image first.");
 const a=document.createElement('a');
 a.download='edited-max-quality.jpg';
 // 1.0 ensures ZERO compression loss on download!
 a.href=canvas.toDataURL('image/jpeg', 1.0);
 a.click();
};
</script>
</body>
