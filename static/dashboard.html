<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Top Bar -->
<div class="w-full bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-semibold">Dashboard</h1>

    <!-- Profile Dropdown -->
    <div class="relative">
        <button id="profileBtn" class="flex items-center space-x-2">
            <div class="w-9 h-9 bg-gray-300 rounded-full"></div>
            <span class="font-medium">{{ username }}</span>
        </button>

        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-40 bg-white shadow-lg rounded-md">
            <a href="/profile" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
            <a href="/settings" class="block px-4 py-2 hover:bg-gray-100">Settings</a>
            <a href="/logout" class="block px-4 py-2 hover:bg-gray-100 text-red-500">Logout</a>
        </div>
    </div>
</div>


<div class="flex">

    <!-- Sidebar -->
    <div class="w-64 bg-white h-screen shadow-lg p-5">
        <ul class="space-y-4">
            <li><a href="/dashboard" class="text-gray-700 font-medium hover:text-blue-600">🏠 Home</a></li>
            <li><a href="/profile" class="text-gray-700 font-medium hover:text-blue-600">👤 Profile</a></li>
            <li><a href="/projects" class="text-gray-700 font-medium hover:text-blue-600">📁 Projects</a></li>
            <li><a href="/settings" class="text-gray-700 font-medium hover:text-blue-600">⚙ Settings</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
        <h2 class="text-3xl font-semibold mb-4">Welcome back, {{ username }} 👋</h2>

        <div class="bg-white p-6 rounded-lg shadow">
            <p class="text-gray-600">Your email: <span class="font-medium">{{ email }}</span></p>

            <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">

                <div class="p-5 bg-blue-500 text-white rounded-lg shadow">
                    <h3 class="text-xl font-semibold">Profile</h3>
                    <p class="opacity-80">View and update profile</p>
                </div>

                <div class="p-5 bg-green-500 text-white rounded-lg shadow">
                    <h3 class="text-xl font-semibold">Projects</h3>
                    <p class="opacity-80">Manage your work</p>
                </div>

                <div class="p-5 bg-purple-500 text-white rounded-lg shadow">
                    <h3 class="text-xl font-semibold">Settings</h3>
                    <p class="opacity-80">Adjust preferences</p>
                </div>

            </div>
        </div>
    </div>
</div>


<script>
    document.getElementById("profileBtn").onclick = function () {
        document.getElementById("dropdownMenu").classList.toggle("hidden");
    };
</script>

</body>
</html>
